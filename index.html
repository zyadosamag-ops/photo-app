<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14213d">
<title>صوّر وابعت</title>
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22%D8%B5%D9%88%D9%91%D8%B1%20%D9%88%D8%A7%D8%A8%D8%B9%D8%AA%22%2C%22display%22%3A%22standalone%22%2C%22start_url%22%3A%22.%22%2C%22background_color%22%3A%22%2314213d%22%2C%22theme_color%22%3A%22%2314213d%22%7D">
<style>
:root{--bg:#f3f1ec;--ink:#14213d;--mut:#5b6478;--card:#fff;--line:#d9d5cb;--acc:#e07a1f;--accink:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0e1424;--ink:#eef1f8;--mut:#9aa4bb;--card:#18203a;--line:#2a3555;--acc:#f2923a;--accink:#14213d}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",system-ui,sans-serif;line-height:1.6}
body{padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
h1{font-size:1.35rem;margin:4px 0 14px}
label{display:block;font-size:.9rem;color:var(--mut);margin:12px 0 4px}
textarea,input[type=password],input[type=text]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
textarea{min-height:96px;resize:vertical}
.cam{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:22px;border:0;border-radius:18px;background:var(--acc);color:var(--accink);font:inherit;font-size:1.25rem;font-weight:700;cursor:pointer}
.cam:active{transform:scale(.98)}
.cam[disabled]{opacity:.6}
input[type=file]{display:none}
.sec{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:14px}
.sec summary{cursor:pointer;font-weight:600}
.btn2{margin-top:10px;padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;cursor:pointer}
img#prev{display:none;width:100%;max-height:300px;object-fit:contain;border-radius:12px;margin-top:14px;background:var(--card)}
#out{white-space:pre-wrap;margin-top:14px;padding:14px;border-radius:14px;background:var(--card);border:1px solid var(--line);display:none;unicode-bidi:plaintext}
#out.err{border-color:#c0392b;color:#c0392b}
.row{display:flex;gap:8px}
.row>*{flex:1}
</style>
</head>
<body>
<h1>صوّر وابعت</h1>

<button class="cam" id="camBtn">📷 صوّر</button>
<input type="file" id="cam" accept="image/*" capture="environment">
<input type="file" id="pick" accept="image/*">
<div class="row" style="margin-top:8px"><button class="btn2" id="pickBtn">اختار من المعرض</button><button class="btn2" id="copyBtn">انسخ الرد</button></div>

<img id="prev" alt="">
<div id="out"></div>

<details class="sec" id="settings">
<summary>الإعدادات</summary>
<label for="prompt">الرسالة الثابتة (بتتبعت مع كل صورة)</label>
<textarea id="prompt" placeholder="مثال: راجع الصورة دي وقولي أي تعديلات أو تحسينات ممكن تتعمل."></textarea>
<label for="key">OpenAI API key</label>
<input type="password" id="key" placeholder="sk-..." autocomplete="off">
<label for="model">الموديل</label>
<input type="text" id="model" dir="ltr" placeholder="gpt-4o">
<button class="btn2" id="save">حفظ</button>
</details>

<script>
const $=id=>document.getElementById(id);
const get=(k,d='')=>{try{return localStorage.getItem(k)??d}catch(e){return d}};
const set=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};

$('prompt').value=get('prompt','راجع الصورة دي وقولي أي تعديلات أو تحسينات ممكن تتعمل.');
$('key').value=get('key');
$('model').value=get('model','gpt-4o');
if(!get('key')) $('settings').open=true;

$('save').onclick=()=>{set('prompt',$('prompt').value.trim());set('key',$('key').value.trim());set('model',$('model').value.trim()||'gpt-4o');$('save').textContent='اتحفظ ✓';setTimeout(()=>$('save').textContent='حفظ',1200)};
$('camBtn').onclick=()=>$('cam').click();
$('pickBtn').onclick=()=>$('pick').click();
$('copyBtn').onclick=async()=>{try{await navigator.clipboard.writeText($('out').textContent);$('copyBtn').textContent='اتنسخ ✓';setTimeout(()=>$('copyBtn').textContent='انسخ الرد',1200)}catch(e){}};
$('cam').onchange=$('pick').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)send(f)};

function toDataUrl(file,max=1600){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{
      const s=Math.min(1,max/Math.max(im.width,im.height));
      const c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',.85));
    };
    im.onerror=()=>rej(new Error('مقدرتش أقرا الصورة'));
    im.src=url;
  });
}

async function send(file){
  const out=$('out');out.style.display='block';out.className='';
  const key=get('key');
  if(!key){out.className='err';out.textContent='حط الـ API key في الإعدادات الأول.';$('settings').open=true;return}
  $('camBtn').disabled=true;out.textContent='بيتبعت...';
  try{
    const img=await toDataUrl(file);
    const p=$('prev');p.src=img;p.style.display='block';
    const r=await fetch('https://api.openai.com/v1/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
      body:JSON.stringify({model:get('model','gpt-4o'),messages:[{role:'user',content:[
        {type:'text',text:get('prompt')},
        {type:'image_url',image_url:{url:img}}
      ]}]})
    });
    const d=await r.json();
    if(!r.ok) throw new Error(d.error?.message||('خطأ '+r.status));
    out.textContent=d.choices[0].message.content;
  }catch(e){out.className='err';out.textContent=e.message}
  $('camBtn').disabled=false;
}
</script>
</body>
</html>
