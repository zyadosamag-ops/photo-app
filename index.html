<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://generativelanguage.googleapis.com" crossorigin>
<link rel="preconnect" href="https://api.telegram.org" crossorigin>
<meta name="theme-color" content="#14213d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="صوّر الأسئلة واحصل على إجابات سريعة باستخدام Gemini">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>صوّر وابعت</title>
<style>
:root{--bg:#f3f1ec;--ink:#14213d;--mut:#5b6478;--card:#fff;--line:#d9d5cb;--acc:#e07a1f;--ai:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0e1424;--ink:#eef1f8;--mut:#9aa4bb;--card:#18203a;--line:#2a3555;--acc:#f2923a;--ai:#14213d}}
*{box-sizing:border-box;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,system-ui,sans-serif;line-height:1.6}
body{padding:max(12px,env(safe-area-inset-top)) 12px max(24px,env(safe-area-inset-bottom));max-width:600px;margin:0 auto}
button,input,textarea{font:inherit;color:inherit}
textarea,input[type=password],input[type=text]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
textarea{min-height:80px;resize:vertical}
label{display:block;font-size:.85rem;color:var(--mut);margin:10px 0 4px}
.b{padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer}
.b.p{background:var(--acc);color:var(--ai);border:0;font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>.g{flex:1}
#top{position:sticky;top:0;z-index:5;background:var(--bg);padding:4px 0 6px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px}
.chip{white-space:nowrap;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer}
.chip.on{background:var(--acc);color:var(--ai);border-color:var(--acc);font-weight:700}
#cam{display:none;position:relative;margin:0 0 8px;border-radius:16px;overflow:hidden;background:#000}
video{width:100%;max-height:32vh;display:block;object-fit:cover}
#shut{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);width:66px;height:66px;border-radius:50%;border:5px solid #fff;background:rgba(255,255,255,.35)}
#shut:active{background:#fff}
#camx{position:absolute;top:8px;right:8px}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
#tray{display:flex;gap:6px;overflow-x:auto;margin:6px 0}
.th{position:relative;flex:0 0 auto}
.th img{height:56px;width:56px;object-fit:cover;border-radius:8px;display:block}
.th i{position:absolute;top:-4px;left:-4px;background:#c0392b;color:#fff;border-radius:50%;width:20px;height:20px;font-style:normal;text-align:center;line-height:20px;font-size:13px;cursor:pointer}
.card{margin:10px 0;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:var(--card);overflow-wrap:anywhere}
.ch{display:flex;gap:10px;align-items:center}
.ch img{width:52px;height:52px;object-fit:cover;border-radius:8px}
.ch b{flex:1}
.ans{font-size:1.08rem;margin-top:8px}
.ans.err{color:#c0392b}
.q{color:var(--mut);font-size:.9rem;margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.ans p{margin:.35em 0}
.ans pre{background:#0b1020;color:#e6e9f2;padding:10px;border-radius:8px;overflow-x:auto;text-align:left}
.ans code{background:rgba(127,127,127,.2);padding:0 4px;border-radius:4px}
.ans pre code{background:none;padding:0}
.tw{overflow-x:auto}
table{border-collapse:collapse}
td,th{border:1px solid var(--line);padding:4px 8px}
.fu{margin-top:10px}
.fu input{flex:1}
.sec{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-top:12px}
.sec summary{cursor:pointer;font-weight:600}
.hi{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
.hi img{width:44px;height:44px;object-fit:cover;border-radius:8px}
.hi small{color:var(--mut)}
input[type=file]{display:none}
/* Mini window: works within the app/page, not over other iOS apps */
#miniToggle{position:fixed;left:14px;bottom:max(18px,env(safe-area-inset-bottom));z-index:40;border:0;border-radius:50px;background:var(--acc);color:#fff;box-shadow:0 5px 18px #0005;padding:12px 17px;font-weight:700;cursor:pointer}
#miniHeader{display:none;align-items:center;gap:6px;padding:8px 10px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:8}
#miniHeader strong{flex:1;font-size:.9rem}
#miniHeader button{padding:5px 9px}
body.mini-mode{max-width:none;padding:0;overflow:hidden}
body.mini-mode #miniShell{position:fixed;top:max(12px,env(safe-area-inset-top));right:12px;width:min(370px,calc(100vw - 24px));height:min(68dvh,610px);background:var(--bg);border:1px solid var(--line);border-radius:17px;box-shadow:0 12px 40px #0006;z-index:35;display:flex;flex-direction:column;overflow:hidden}
body.mini-mode #miniHeader{display:flex;flex:none}
body.mini-mode #miniContent{overflow-y:auto;overscroll-behavior:contain;padding:7px 10px 12px;flex:1;min-height:0}
body.mini-mode #top{position:relative;top:auto}
body.mini-mode #top .row>.g{min-width:100px}
body.mini-mode #top button{font-size:.83rem;padding:7px 9px}
body.mini-mode #top label{font-size:.75rem}
body.mini-mode #cam video{max-height:22vh}
body.mini-mode #feed .card{padding:9px}
body.mini-mode #miniToggle{display:none}
body.mini-mode>.sec{display:none}
body.mini-mode #miniContent{ -webkit-overflow-scrolling:touch }
body.mini-mode #feed .ans{font-size:1rem}
button:focus-visible,summary:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
body.mini-collapsed #miniShell{display:none}
body.mini-collapsed #miniToggle{display:block}
@media(max-width:420px){body.mini-mode #miniShell{width:calc(100vw - 24px);height:65dvh}}
</style>
</head>
<body>
<button id="miniToggle" type="button" aria-label="افتح النافذة الصغيرة">▣ نافذة صغيرة</button>
<div id="miniShell">
<div id="miniHeader"><strong>📷 صوّر وابعت — شاشة صغيرة</strong><button class="b" id="miniCollapse" type="button" title="تصغير إلى علامة">—</button><button class="b" id="miniSettings" type="button" title="الإعدادات">⚙</button><button class="b" id="miniFull" type="button" title="شاشة كاملة">⛶</button></div>
<div id="miniContent">
<div id="top">
<div class="chips" id="chips"></div>
<div id="cam"><video id="vid" playsinline muted autoplay></video><button class="b" id="camx">✕</button><button id="shut" aria-label="صوّر"></button><div id="flash"></div></div>
<div class="row">
<button class="b p g" id="camBtn">📷 افتح الكاميرا</button>
<button class="b g" id="galBtn">🖼 صورة / Screenshot</button>
<button class="b g" id="natBtn">📸 كاميرا الأيفون (أوضح)</button>
</div>
<input type="file" id="fcam" accept="image/*" capture="environment">
<input type="file" id="fgal" accept="image/*" multiple>
<label class="row" style="margin:8px 0 0;color:var(--ink)"><input type="checkbox" id="auto"> ابعت كل صورة فوراً <span style="color:var(--mut)">(لو مقفول: صوّر كذا صورة وبعدين ابعت)</span></label>
<label class="row" style="margin:4px 0 0;color:var(--ink)"><input type="checkbox" id="fast"> ⚡ وضع سريع (موديل أخف)</label>
<div id="tray"></div>
<button class="b p" id="send" style="display:none;width:100%">ابعت</button>
</div>

<div id="feed"></div>
</div>
</div>

<details class="sec"><summary>السجل</summary><div id="hl"></div><button class="b" id="hclr" style="margin-top:8px">امسح السجل</button></details>

<details class="sec" id="sd"><summary>الإعدادات</summary>
<label>الرسالة المختارة: الاسم</label><input type="text" id="pn" autocorrect="off" autocapitalize="off" spellcheck="false">
<label>نص الرسالة (بتتبعت مع كل صورة)</label><textarea id="pt" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
<div class="row" style="margin-top:8px"><button class="b" id="ps">حفظ الرسالة</button><button class="b" id="pnew">رسالة جديدة</button><button class="b" id="pdel">حذف</button></div>
<label>Gemini API key (يتطلب مفتاحًا صالحًا وقد توجد حدود استخدام أو رسوم)</label><input type="password" id="key" placeholder="AIza..." autocomplete="off">
<label>الموديل</label><input type="text" id="model" dir="ltr" placeholder="gemini-3.8-flash">
<button class="b" id="ks" style="margin-top:10px">حفظ المفتاح والموديل</button>
<label class="row" style="color:var(--ink);margin-top:12px"><input type="checkbox" id="ac"> افتح الكاميرا تلقائي أول ما أفتح البرنامج</label>
<label class="row" style="color:var(--ink)"><input type="checkbox" id="brief"> رد مختصر وسريع (بيضيف تعليمات من عندي، مقفول من الأول)</label>
<label class="row" style="color:var(--ink)"><input type="checkbox" id="nt"> اعرض الإجابة كإشعار أثناء تشغيل التطبيق (قد تصل للساعة)</label>
<small style="color:var(--mut)">على iOS الإشعارات تتطلب تثبيت التطبيق على الشاشة الرئيسية والسماح بها. الإرسال بعد إغلاق التطبيق يحتاج Web Push وخادمًا مستقلًا.</small>
<div class="row"><button class="b" id="ntt">جرّب إشعار</button><small id="nts" style="color:var(--mut)"></small></div>
<label class="row" style="color:var(--ink);margin-top:12px"><input type="checkbox" id="tg"> ابعت الإجابة كمان على تيليجرام (لو إشعارات البرنامج مش بتوصل الساعة)</label>
<label class="row" style="color:var(--ink)"><input type="checkbox" id="split"> ابعت كل سؤال في رسالة منفصلة (تيليجرام والإشعارات)</label>
<label>Telegram Bot Token</label><input type="password" id="tgt" dir="ltr" placeholder="123456:ABC..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
<label>Telegram Chat ID</label><input type="text" id="tgc" dir="ltr" inputmode="numeric" placeholder="123456789" autocorrect="off" autocapitalize="off" spellcheck="false">
<div class="row" style="margin-top:8px"><button class="b" id="tgf">اكتشف Chat ID</button><button class="b" id="tgx">جرّب تيليجرام</button></div>
<small id="tgm" style="color:var(--mut)"></small>
</details>

<script>
const $=id=>document.getElementById(id);
/* A small, resizable-feeling app panel; it cannot appear on top of other iOS apps. */
function setMini(mode){
  document.body.classList.toggle('mini-mode',mode!=='full');
  document.body.classList.toggle('mini-collapsed',mode==='collapsed');
  $('miniToggle').textContent=mode==='collapsed'?'◉ افتح النافذة':'▣ نافذة صغيرة';
  $('miniToggle').setAttribute('aria-label',mode==='collapsed'?'افتح النافذة الصغيرة':'حوّل إلى النافذة الصغيرة');
  if(mode==='collapsed')camOff();
  try{sessionStorage.setItem('miniMode',mode)}catch(e){}
}
$('miniToggle').onclick=()=>setMini('open');
$('miniCollapse').onclick=()=>setMini('collapsed');
$('miniFull').onclick=()=>setMini('full');
$('miniSettings').onclick=()=>{setMini('full');$('sd').open=true;$('sd').scrollIntoView({behavior:'smooth',block:'start'})};

const J=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const S=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}};
const DM='gemini-3.8-flash',FB='gemini-3.5-flash-lite',BASE='https://generativelanguage.googleapis.com/v1beta/models/',HK='hist2';
const SYS='جاوب بسرعة وباختصار. ابدأ بالإجابة النهائية أو الحل مباشرة في أول سطر بخط عريض، وبعدها الخطوات أو الشرح في أقل عدد ممكن من الأسطر. استخدم نفس لغة المستخدم.';
const DEF=[{n:'مراجعة',t:'راجع الصورة دي وقولي أي تعديلات أو تحسينات ممكن تتعمل.'},{n:'اشرح',t:'اشرح اللي في الصورة بالتفصيل.'},{n:'حل',t:'حل المسألة اللي في الصورة. اكتب الإجابة النهائية الأول في سطر واحد، وبعدها الخطوات باختصار.'},{n:'ترجم',t:'ترجم النص اللي في الصورة للعربي.'}];
let presets=J('presets',DEF),sel=Math.min(J('sel',0),presets.length-1),photos=[],stream=null,wantCam=false,running=0;
const queue=[];
if(['gemini-2.5-flash','gemini-2.5-flash-lite'].includes(J('model2','')))S('model2',DM);

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function cleanMath(s){
  const p=x=>/^[\w.°]+$/.test(x)?x:'('+x+')';
  const R=[[/\$([^$\n]*\\[^$\n]*)\$/g,'$1'],[/\\left|\\right/g,''],[/\\(?:text|mathrm|mathbf|operatorname)\{([^{}]*)\}/g,'$1'],[/\^\{?\\circ\}?/g,'°'],[/\\circ/g,'°'],[/\\times/g,'×'],[/\\cdot/g,'·'],[/\\div/g,'÷'],[/\\sim/g,'~'],[/\\(?:implies|Rightarrow|rightarrow|to)(?![a-zA-Z])/g,'⇒'],[/\\leq?(?![a-zA-Z])/g,'≤'],[/\\geq?(?![a-zA-Z])/g,'≥'],[/\\neq/g,'≠'],[/\\approx/g,'≈'],[/\\pm/g,'±'],[/\\pi(?![a-zA-Z])/g,'π'],[/\\angle/g,'∠'],[/\\triangle/g,'△'],[/\\parallel/g,'∥'],[/\\perp/g,'⊥'],[/\\infty/g,'∞'],[/\\%/g,'%'],[/\\[,;! ]/g,' '],[/\$\$([\s\S]+?)\$\$/g,'$1'],[/\$(?=\S)([^$\n]*?\S)\$/g,'$1'],[/\\\(|\\\)|\\\[|\\\]/g,'']];
  R.forEach(([a,b])=>{s=s.replace(a,b)});
  for(let i=0;i<4;i++)s=s.replace(/\\d?frac\{([^{}]*)\}\{([^{}]*)\}/g,(m,a,b)=>p(a)+'/'+p(b)).replace(/\\sqrt\{([^{}]*)\}/g,(m,a)=>'√'+p(a));
  return s.replace(/\^\{([^{}]*)\}/g,'^$1').replace(/_\{([^{}]*)\}/g,'_$1').replace(/\^2(?![\d])/g,'²').replace(/\^3(?![\d])/g,'³');
}
function md(s){
  const blocks=[];
  s=esc(s).replace(/```[\w-]*\n?([\s\S]*?)```/g,(m,c)=>{blocks.push('<pre><code>'+c+'</code></pre>');return '\u0000'+(blocks.length-1)+'\u0000'}).replace(/`([^`\n]+)`/g,(m,c)=>{blocks.push('<code>'+c+'</code>');return '\u0000'+(blocks.length-1)+'\u0000'});
  s=cleanMath(s);
  const inl=t=>t.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  let o='',list=null,tbl=[];
  const fl=k=>{
    if(list&&list!==k){o+='</'+list+'>';list=null}
    if(tbl.length&&k!=='t'){
      const rows=tbl.filter(r=>!/^\|[\s:|-]+\|?$/.test(r)).map(r=>r.replace(/^\||\|$/g,'').split('|').map(c=>inl(c.trim())));
      o+='<div class="tw"><table>'+rows.map((r,i)=>'<tr>'+r.map(c=>(i?'<td>':'<th>')+c+(i?'</td>':'</th>')).join('')+'</tr>').join('')+'</table></div>';tbl=[];
    }
  };
  for(const ln of s.split('\n')){
    let m;
    if(!ln.trim())continue;
    if(/^\|/.test(ln)){fl('t');tbl.push(ln.trim());continue}
    if(m=ln.match(/^\s*[-*•]\s+(.*)/)){fl('ul');if(list!=='ul'){o+='<ul>';list='ul'}o+='<li dir="auto">'+inl(m[1])+'</li>';continue}
    if(m=ln.match(/^\s*(\d+)[.)]\s+(.*)/)){fl('ol');if(list!=='ol'){o+='<ol start="'+m[1]+'">';list='ol'}o+='<li dir="auto">'+inl(m[2])+'</li>';continue}
    fl();
    if(/^\u0000\d+\u0000$/.test(ln.trim())){o+=ln.trim();continue}
    if(m=ln.match(/^(#{1,4})\s+(.*)/)){const n=m[1].length+2;o+='<h'+n+'>'+inl(m[2])+'</h'+n+'>';continue}
    o+='<p dir="auto">'+inl(ln)+'</p>';
  }
  fl();
  return o.replace(/\u0000(\d+)\u0000/g,(m,i)=>blocks[i]);
}
const IQ=()=>J('fast',false)?[1100,.72]:[1600,.85];
function toUrl(src,max,q){
  return new Promise((res,rej)=>{
    const im=new Image(),isF=src instanceof Blob,u=isF?URL.createObjectURL(src):src;
    im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);if(isF)URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',q))};
    im.onerror=()=>{if(isF)URL.revokeObjectURL(u);rej(new Error('مقدرتش أقرا الصورة. جرّب Screenshot بصيغة PNG أو JPG'))};im.src=u;
  });
}

/* ---------- settings ---------- */
function renderChips(){
  const c=$('chips');c.innerHTML='';
  presets.forEach((p,i)=>{const b=document.createElement('button');b.className='chip'+(i===sel?' on':'');b.textContent=p.n;b.onclick=()=>{sel=i;S('sel',i);renderChips();fillEd()};c.appendChild(b)});
}
function fillEd(){$('pn').value=presets[sel].n;$('pt').value=presets[sel].t}
function savePreset(){presets[sel]={n:$('pn').value.trim()||'رسالة',t:$('pt').value.trim()};S('presets',presets)}
$('pn').oninput=()=>{savePreset();renderChips()};$('pt').oninput=savePreset;
$('ps').onclick=()=>{savePreset();renderChips();$('ps').textContent='اتحفظ ✓';setTimeout(()=>$('ps').textContent='حفظ الرسالة',1200)};
$('pnew').onclick=()=>{presets.push({n:'رسالة جديدة',t:''});sel=presets.length-1;S('presets',presets);S('sel',sel);renderChips();fillEd();$('pt').focus()};
$('pdel').onclick=()=>{if(presets.length<2)return;presets.splice(sel,1);sel=0;S('presets',presets);S('sel',0);renderChips();fillEd()};
$('ks').onclick=()=>{S('gkey',$('key').value.trim());S('model2',$('model').value.trim()||DM);$('ks').textContent='اتحفظ ✓';setTimeout(()=>$('ks').textContent='حفظ المفتاح والموديل',1200)};
$('auto').checked=J('auto',true);$('auto').onchange=()=>S('auto',$('auto').checked);
$('ac').checked=J('autocam',false);$('ac').onchange=()=>S('autocam',$('ac').checked);
$('fast').checked=J('fast',false);$('fast').onchange=()=>S('fast',$('fast').checked);
$('split').checked=J('split',true);$('split').onchange=()=>S('split',$('split').checked);
$('brief').checked=J('brief',false);$('brief').onchange=()=>S('brief',$('brief').checked);
$('key').value=J('gkey','');$('model').value=J('model2',DM);
if(!J('gkey',''))$('sd').open=true;

/* ---------- notifications (to the watch) + keep screen awake ---------- */
const canNotify=()=>'Notification' in window;
function ntStatus(){$('nts').textContent=!canNotify()?'مش متاح هنا: افتح البرنامج من أيقونة الشاشة الرئيسية':({granted:'الإذن شغال ✓',denied:'الإذن مرفوض (فعّله من إعدادات الأيفون)',default:'لسه ما اتطلبش الإذن'})[Notification.permission]||''}
async function askPerm(){let p=canNotify()?Notification.permission:'denied';if(p==='default'){try{p=await Notification.requestPermission()}catch(e){p='denied'}}return p==='granted'}
$('nt').checked=J('notif',false)&&canNotify()&&Notification.permission==='granted';
$('nt').onchange=async()=>{if($('nt').checked&&!(await askPerm()))$('nt').checked=false;S('notif',$('nt').checked);ntStatus()};
$('ntt').onclick=async()=>{const g=await askPerm();ntStatus();if(!g)return;const r=await notify('صوّر وابعت','لو الإشعار ده وصل على الساعة، كل حاجة تمام ✓');if(!r)$('nts').textContent='الإشعار ما اتبعتش'};
ntStatus();
function plain(t,max){
  const s=cleanMath(t).replace(/```[\s\S]*?```/g,' ').replace(/[*_`#>|]/g,'').replace(/^\s*[-•]\s+/gm,'• ').replace(/\n{2,}/g,'\n').trim();
  return s.length>max?s.slice(0,max-1).trimEnd()+'…':s;
}
async function notify(title,body){
  try{
    if(!canNotify()||Notification.permission!=='granted')return false;
    const o={body,lang:'ar',dir:'rtl',tag:'a'+Date.now()};
    const reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();
    if(reg&&reg.showNotification)await reg.showNotification(title,o);else new Notification(title,o);
    return true;
  }catch(e){return false}
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function splitQ(t){
  const re=/^\s*(?:[-*•]\s*)?(?:\*\*)?\s*(?:السؤال|سؤال|س|Q(?:uestion)?)\s*[(#]?\s*\d+/i,ch=[];let cur=null;
  for(const ln of t.split('\n')){if(re.test(ln)){if(cur)ch.push(cur.join('\n'));cur=[ln]}else if(cur)cur.push(ln)}
  if(cur)ch.push(cur.join('\n'));
  return ch.length>=2?ch:[t];
}
function deliver(c,t,fb){
  const on=J('notif',false),tg=J('tg',false)&&tgOk();if(!on&&!tg)return Promise.resolve();
  const parts=J('split',true)?splitQ(t):[t],tag=fb?' (موديل أخف)':'';
  const items=parts.map((x,i)=>({p:x.replace(/^\s*[-*•]\s+/,''),ttl:c.name+(parts.length>1?' ('+(i+1)+'/'+parts.length+')':'')}));
  if(tg)items.forEach(o=>tgSendQ(o.ttl+tag+'\n\n'+plain(o.p,1500)));
  return (async()=>{if(on)for(let i=0;i<items.length;i++){notify(items[i].ttl+tag,plain(items[i].p,220));if(i<items.length-1)await sleep(300)}})();
}
const tgChat=()=>String(J('tgc','')).replace(/[^\d-]/g,'');
const tgOk=()=>!!(cleanTok(J('tgt',''))&&tgChat());
async function tgSend(text){
  try{
    const r=await fetch('https://api.telegram.org/bot'+cleanTok(J('tgt',''))+'/sendMessage',{method:'POST',body:new URLSearchParams({chat_id:tgChat(),text,disable_web_page_preview:'true'})});
    const d=await r.json().catch(()=>null);
    return d?{ok:!!d.ok,msg:d.description||'',retry:(d.parameters&&d.parameters.retry_after)||0}:{ok:r.ok,msg:'',retry:0};
  }catch(e){return {ok:null,msg:'',retry:0}}
}
let tgChain=Promise.resolve();
function tgSendQ(text){
  const job=tgChain.then(async()=>{let r=await tgSend(text);if(r.ok===false&&r.retry){await sleep(Math.min(r.retry,30)*1000+300);r=await tgSend(text)}await sleep(400);return r});
  tgChain=job.catch(()=>{});return job;
}
$('tg').checked=J('tg',false);$('tg').onchange=()=>S('tg',$('tg').checked);
$('tgt').value=J('tgt','');$('tgc').value=J('tgc','');
const cleanTok=v=>{const m=String(v).match(/\d{6,}:[A-Za-z0-9_-]{30,}/);return m?m[0]:String(v).replace(/[^0-9A-Za-z:_-]/g,'').replace(/^bot/i,'')};
const tokNote=t=>/^\d{6,}:[A-Za-z0-9_-]{30,}$/.test(t)?'شكل الـ Token صح ✓ ('+t.length+' حرف)':'الـ Token شكله ناقص أو غلط ('+t.length+' حرف). الصح حوالي 46 حرف';
const tgHint=m=>/chat not found/i.test(m)?' — الـ Chat ID غلط، أو لسه ما دستش Start للبوت':/not found|unauthorized/i.test(m)?' — الـ Token غلط، انسخه تاني من BotFather':'';

};
$('tgf').onclick=async()=>{
  const t=cleanTok($('tgt').value);if(!t){$('tgm').textContent='اكتب الـ Token الأول';return}
  $('tgm').textContent='⏳';
  try{
    const d=await (await fetch('https://api.telegram.org/bot'+t+'/getUpdates')).json();
    if(!d.ok){$('tgm').textContent='فشل: '+(d.description||'الـ Token غلط')+tgHint(d.description||'');return}

    if(!m){$('tgm').textContent='ابعت أي رسالة للبوت في تيليجرام الأول وبعدين دوس تاني';return}
    const id=String((m.message||m.edited_message).chat.id);$('tgc').value=id;S('tgc',id);$('tgm').textContent='اتلقى ✓ '+id;
  }catch(e){$('tgm').textContent='مقدرتش أجيبه تلقائي. اكتبه بإيدك'}
};
let wl=null;
async function syncWake(){
  const want=!!stream||running>0||queue.length>0;
  try{
    if(want&&!wl&&navigator.wakeLock){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null})}
    else if(!want&&wl){const w=wl;wl=null;await w.release()}
  }catch(e){wl=null}
}

/* ---------- camera / photos ---------- */
function renderTray(){

  photos.forEach((u,i)=>{const d=document.createElement('div');d.className='th';d.innerHTML='<img src="'+u+'"><i>×</i>';d.querySelector('i').onclick=()=>{photos.splice(i,1);renderTray()};t.appendChild(d)});
  $('send').style.display=photos.length?'block':'none';$('send').textContent='ابعت ('+photos.length+' صورة)';
}
function addUrls(urls){
  if($('auto').checked){newCard(urls);return}
  photos.push(...urls);photos=photos.slice(0,10);renderTray();
}
async function camOn(auto){
  if(stream)return;
  try{
    if(!navigator.mediaDevices?.getUserMedia)throw new Error('الكاميرا داخل المتصفح غير متاحة');
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});
    $('vid').srcObject=stream;$('cam').style.display='block';$('camBtn').style.display='none';wantCam=true;syncWake();
    $('vid').play().catch(()=>{});
    stream.getTracks()[0].onended=()=>{stream=null;$('cam').style.display='none';$('camBtn').style.display='';syncWake()};
  }catch(e){if(!auto)$('fcam').click()}
}
function camOff(){wantCam=false;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$('vid').srcObject=null;$('cam').style.display='none';$('camBtn').style.display='';syncWake()}
$('camBtn').onclick=()=>camOn();$('camx').onclick=camOff;
$('shut').onclick=()=>{
  const v=$('vid');if(!v.videoWidth)return;
  const [mx,qq]=IQ(),s=Math.min(1,mx/Math.max(v.videoWidth,v.videoHeight)),c=document.createElement('canvas');
  c.width=Math.round(v.videoWidth*s);c.height=Math.round(v.videoHeight*s);c.getContext('2d').drawImage(v,0,0,c.width,c.height);
  const f=$('flash');f.style.transition='none';f.style.opacity='.8';requestAnimationFrame(()=>{f.style.transition='opacity .25s';f.style.opacity='0'});
  if(navigator.vibrate)navigator.vibrate(25);
  addUrls([c.toDataURL('image/jpeg',qq)]);
};

$('natBtn').onclick=()=>$('fcam').click();
async function files(e){const fs=[...e.target.files];e.target.value='';if(!fs.length)return;try{addUrls(await Promise.all(fs.map(f=>toUrl(f,IQ()[0],IQ()[1]))))}catch(x){errCard(x.message)}}
$('fcam').onchange=files;$('fgal').onchange=files;
$('send').onclick=()=>{const u=photos.slice();photos=[];renderTray();newCard(u)};
function errCard(t){const d=document.createElement('div');d.className='card ans err';d.textContent=t;$('feed').prepend(d)}

/* ---------- requests (streaming, parallel, auto-fallback) ---------- */
function pump(){while(running<3&&queue.length){const j=queue.shift();running++;j().finally(()=>{running--;pump();syncWake()})}syncWake()}
async function once(m,hist,key,onText,level,fast){
  const ac=new AbortController();let to=setTimeout(()=>ac.abort(),fast?30000:90000);const all=setTimeout(()=>ac.abort(),fast?120000:180000);
  const body={contents:hist};
  if(J('brief',false))body.systemInstruction={parts:[{text:SYS}]};
  if(level&&/^gemini-3/.test(m))body.generationConfig={thinkingConfig:{thinkingLevel:level}};
  const net=e=>new Error(e&&e.name==='AbortError'?'الرد اتأخر.':'مفيش اتصال أو الطلب اتقطع.');
  try{
    let r;
    try{r=await fetch(BASE+encodeURIComponent(m)+':streamGenerateContent?alt=sse',{method:'POST',signal:ac.signal,headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify(body)})}catch(e){throw net(e)}
    clearTimeout(to);
    if(!r.ok){const d=await r.json().catch(()=>({}));throw Object.assign(new Error(d.error?.message||('خطأ '+r.status)),{status:r.status})}
    if(!r.body?.getReader)throw new Error('المتصفح لا يدعم استقبال الرد المتدفق. حدّث iOS.');
    const rd=r.body.getReader(),dec=new TextDecoder();let buf='',full='';
    const feed=ln=>{if(ln.startsWith('data:')){try{const j=JSON.parse(ln.slice(5));const t=(j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('');if(t){full+=t;onText(full)}}catch(e){}}};
    try{
      for(;;){
        const {done,value}=await rd.read();if(done)break;
        buf+=dec.decode(value,{stream:true});let i;
        while((i=buf.indexOf('\n'))>=0){feed(buf.slice(0,i).trim());buf=buf.slice(i+1)}
      }
      feed(buf.trim());
    }catch(e){if(!full)throw net(e)}
    if(!full)throw new Error('مفيش رد (ممكن الصورة اتحجبت). جرّب صورة تانية.');
    return full;
  }finally{clearTimeout(to);clearTimeout(all)}
}
const retriable=e=>!e.status||e.status===404||e.status===429||e.status>=500||/no longer|not found|not supported/i.test(e.message);
const lvl={};
async function run(hist,onText,onNote,info){
  const key=J('gkey','');
  if(!key){setMini('full');$('sd').open=true;throw new Error('حط الـ API key في الإعدادات الأول.')}
  const fast=J('fast',false),main=J('model2',DM),ord=fast?[FB,main]:[main,FB],ms=ord.filter((m,i)=>ord.indexOf(m)===i);
  const LVS=fast?['minimal','low',null]:[null];
  let last;
  for(let i=0;i<ms.length;i++){
    const m=ms[i];let e=null;
    for(let li=lvl[m+fast]||0;li<LVS.length;li++){
      try{const t=await once(m,hist,key,onText,LVS[li],fast);lvl[m+fast]=li;if(info)info.model=m;return t}
      catch(x){e=x;if(x.status===400&&!/api key/i.test(x.message)&&li<LVS.length-1)continue;break}
    }
    last=e;
    if(!retriable(e))throw e;
    if(i<ms.length-1)onNote('↪ موديل تاني');
  }
  throw last;
}

/* ---------- cards ---------- */
function speak(t){
  const ss=window.speechSynthesis;if(!ss)return;
  if(ss.speaking){ss.cancel();return}
  const p=t.replace(/```[\s\S]*?```/g,' ').replace(/[*#`|_>-]/g,' ');
  const u=new SpeechSynthesisUtterance(p);u.lang=/[\u0600-\u06FF]/.test(p)?'ar-SA':'en-US';ss.speak(u);
}
function newCard(urls){
  const p=presets[sel],txt=p.t||'اشرح الصورة.';
  const c={id:Date.now()+Math.random(),name:p.n,th:'',m:[{r:'u',t:txt}],
    hist:[{role:'user',parts:[{text:txt},...urls.map(u=>({inline_data:{mime_type:'image/jpeg',data:u.split(',')[1]}}))]}]};
  const el=document.createElement('div');el.className='card';
  el.innerHTML='<div class="ch"><img src="'+urls[0]+'"><b></b><span></span></div><div class="body"></div><div class="row fu"><input type="text" placeholder="سؤال تاني عن نفس الصورة..."><button class="b">↩</button></div>';
  el.querySelector('b').textContent=p.n+(urls.length>1?' ('+urls.length+' صور)':'');
  c.st=el.querySelector('.ch span');c.body=el.querySelector('.body');c.fu=el.querySelector('.fu input');
  el.querySelector('.fu button').onclick=()=>follow(c);c.fu.onkeydown=e=>{if(e.key==='Enter')follow(c)};
  $('feed').prepend(el);
  toUrl(urls[0],140,.6).then(t=>c.th=t).catch(()=>{});
  ask(c,null);
}
function follow(c){
  const q=c.fu.value.trim();
  if(!q)return;
  if(c.hist[c.hist.length-1].role!=='model'){c.fu.placeholder='استنى الرد الأول (أو دوس 🔄 أعد)';return}
  c.fu.value='';ask(c,q);
}
const VERIFY='راجع إجابتك السابقة خطوة بخطوة وتأكد من كل رقم. لو لقيت أي غلط صححه بوضوح، ولو كل حاجة صح قول "الإجابة صحيحة" باختصار.';
function ask(c,q){
  const g=document.createElement('div');
  if(q){const d=document.createElement('div');d.className='q';d.textContent=q;g.appendChild(d)}
  const out=document.createElement('div');out.className='ans';out.textContent='⏳ بيتبعت...';g.appendChild(out);
  c.body.appendChild(g);c.st.textContent='⏳';
  queue.push(async()=>{
    if(q)c.hist.push({role:'user',parts:[{text:q}]});
    let raf=0,cur='',t;const info={};
    try{
      t=await run(c.hist,x=>{cur=x;if(!raf)raf=requestAnimationFrame(()=>{raf=0;out.innerHTML=md(cur)})},n=>c.st.textContent=n,info);
    }catch(e){
      cancelAnimationFrame(raf);
      if(q)c.hist.pop();
      out.className='ans err';out.textContent=e.message+' ';
      const b=document.createElement('button');b.className='b';b.textContent='🔄 أعد';b.onclick=()=>{g.remove();ask(c,q)};out.appendChild(b);c.st.textContent='✗';
      if(J('notif',false))notify(c.name,'⚠️ '+e.message);
      if(J('tg',false)&&tgOk())tgSendQ('⚠️ '+c.name+': '+e.message);
      return;
    }
    cancelAnimationFrame(raf);
    c.hist.push({role:'model',parts:[{text:t}]});
    const fb=!!info.model&&info.model!==(J('fast',false)?FB:J('model2',DM));
    try{
      out.innerHTML=md(t);
      if(fb){const w=document.createElement('div');w.className='q';w.textContent='⚠️ الإجابة دي جت من الموديل الأخف ('+info.model+') لأن الأساسي فشل أو اتأخر. للتأكد دوس ✅ تحقق.';g.appendChild(w)}
      const a=document.createElement('div');a.className='row';a.innerHTML='<button class="b">🔊 اقرا</button><button class="b">انسخ</button><button class="b">✅ تحقق</button>';
      a.children[0].onclick=()=>speak(t);
      a.children[1].onclick=async e=>{try{await navigator.clipboard.writeText(t);e.target.textContent='اتنسخ ✓'}catch(x){e.target.textContent='تعذر النسخ — حدّد النص وانسخه'}};
      a.children[2].onclick=e=>{e.target.disabled=true;ask(c,VERIFY)};
      g.appendChild(a);c.st.textContent=fb?'✓⚠️':'✓';
      if(q)c.m.push({r:'u',t:q});c.m.push({r:'m',t});saveH(c);
    }catch(x){}
    deliver(c,t,fb).catch(()=>{});
  });
  pump();
}

/* ---------- history ---------- */
function saveH(c){
  let h=J(HK,[]).filter(x=>x.id!==c.id);h.unshift({id:c.id,th:c.th,p:c.name,m:c.m});h=h.slice(0,20);
  while(h.length&&!S(HK,h))h.pop();
  renderH();
}
function renderH(){
  const l=$('hl');l.innerHTML='';const h=J(HK,[]);
  if(!h.length){l.innerHTML='<small style="color:var(--mut)">فاضي</small>';return}
  h.forEach(x=>{
    const d=document.createElement('div');d.className='hi';
    d.innerHTML='<img src="'+x.th+'"><div><b></b><br><small>'+new Date(x.id).toLocaleString('ar-EG')+'</small></div>';
    d.querySelector('b').textContent=x.p;
    d.onclick=()=>{
      const el=document.createElement('div');el.className='card';
      el.innerHTML='<div class="ch"><img src="'+x.th+'"><b></b></div>';el.querySelector('b').textContent=x.p;
      x.m.forEach(m=>{const e=document.createElement('div');if(m.r==='u'){e.className='q';e.textContent=m.t}else{e.className='ans';e.innerHTML=md(m.t)}el.appendChild(e)});
      $('feed').prepend(el);window.scrollTo({top:0,behavior:'smooth'});
    };
    l.appendChild(d);
  });
}
$('hclr').onclick=()=>{S(HK,[]);renderH()};
